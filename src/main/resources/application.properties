spring.application.name=baozi-store

# MySQL do compose.yaml; sobrescreva com as variáveis de ambiente se usar outro banco
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/baozi_store}
spring.datasource.username=${DB_USERNAME:baozi}
spring.datasource.password=${DB_PASSWORD:baozi}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
