services:
  mysql:
    image: mysql:8.4
    container_name: baozi-store-mysql
    environment:
      MYSQL_DATABASE: baozi_store
      MYSQL_USER: baozi
      MYSQL_PASSWORD: baozi
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
